const ICONS = {
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"></path></svg>',
  comment:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.8-5A7 7 0 0 1 3 12V9a6 6 0 0 1 6-6h6a6 6 0 0 1 6 6v6Z"></path></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>',
  medal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="5"></circle><path d="m9 13-1 8 4-2 4 2-1-8"></path></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"></path><path d="M8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4M12 12v5M8 21h8M9 17h6"></path></svg>',
  thumbs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 10v10H3V10h4Zm0 8h9a2 2 0 0 0 1.9-1.4l2-6A2 2 0 0 0 18 8h-4l.6-3a2 2 0 0 0-3.8-1L7 10Z"></path></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 14 8l6 2-6 2-2 6-2-6-6-2 6-2 2-6Z"></path></svg>'
};
const feed=document.getElementById('feed'), empty=document.getElementById('empty');
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(name){const s=String(name||'500px').trim();return esc((s.match(/[\u4e00-\u9fff]/)?.[0]||s[0]||'5').toUpperCase())}
function hue(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))%360;return h}
function rankBadge(item){
  if(item.rank<=3)return `<span class="rank-badge top3">${ICONS.medal}<span>Top #${item.rank}</span></span>`;
  if(item.rank<=10)return `<span class="rank-badge top10">${ICONS.medal}<span>Top #${item.rank}</span></span>`;
  return `<span class="rank-badge normal">#${item.rank}</span>`;
}
function card(item){const h=hue(item.user);return `<article class="card" data-rank="${item.rank}" data-search="${esc((item.title+' '+item.user).toLowerCase())}">
  <a class="photo-box" href="${esc(item.photoLink)}" target="_blank" rel="noopener" aria-label="查看作品：${esc(item.title)}">
    <span class="skeleton"></span>
    <img class="photo" loading="lazy" alt="${esc(item.title)}" src="${esc(item.localImage)}" data-fallback="${esc(item.remoteImage)}">
    ${item.rank<=3?`<span class="top-actions"><span class="award-btn">${ICONS.thumbs}</span><span class="award-btn">${ICONS.trophy}</span><span class="award-btn">${ICONS.medal}</span></span>`:''}
    <span class="rank-row">${rankBadge(item)}<span class="score">${Number(item.score).toFixed(2)}</span></span>
  </a>
  <div class="meta">
    <div class="work-title" title="${esc(item.title)}">${esc(item.title)}</div>
    <div class="author-row">
      <span class="avatar" style="background:linear-gradient(135deg,hsl(${h} 72% 58%),hsl(${(h+48)%360} 70% 42%))">${initials(item.user)}</span>
      <span class="author" title="${esc(item.user)}">${esc(item.user)}</span>
      <span class="actions">
        <button class="like" aria-label="点赞" data-count="${item.likes}">${ICONS.heart}</button>
        <button class="comment" aria-label="评论" data-count="${item.comments}">${ICONS.comment}</button>
        <button class="more" aria-label="更多">${ICONS.more}</button>
      </span>
    </div>
  </div>
</article>`}
function render(list){feed.innerHTML=list.map(card).join('');empty.style.display=list.length?'none':'block';bindImages();bindActions()}
function bindImages(){document.querySelectorAll('.photo').forEach(img=>{
  let tried=false;
  img.addEventListener('error',()=>{if(!tried&&img.dataset.fallback){tried=true;img.src=img.dataset.fallback}else{img.closest('.photo-box').style.aspectRatio='4/3'}});
  img.addEventListener('load',()=>{const r=img.naturalWidth/img.naturalHeight;const ratio=Math.max(.82,Math.min(1.9,r||1));img.closest('.photo-box').style.aspectRatio=ratio;img.classList.add('loaded');img.previousElementSibling?.remove()},{once:true});
})}
function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),1500)}
function bindActions(){
  document.querySelectorAll('.like').forEach(b=>b.onclick=()=>{b.classList.toggle('active');showToast(b.classList.contains('active')?`已点赞 · 原有 ${b.dataset.count}`:'已取消点赞')});
  document.querySelectorAll('.comment').forEach(b=>b.onclick=()=>{b.classList.toggle('active');showToast(`评论数 ${b.dataset.count}`)});
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>showToast('更多操作'));
}
render(DATA);
const searchPanel=document.getElementById('searchPanel'),searchInput=document.getElementById('searchInput'),clearSearch=document.getElementById('clearSearch');
document.getElementById('searchBtn').onclick=()=>{searchPanel.classList.toggle('show');if(searchPanel.classList.contains('show'))setTimeout(()=>searchInput.focus(),50)};
function doSearch(){const q=searchInput.value.trim().toLowerCase();clearSearch.style.display=q?'block':'none';render(!q?DATA:DATA.filter(x=>(x.title+' '+x.user).toLowerCase().includes(q)))}
searchInput.oninput=doSearch;clearSearch.onclick=()=>{searchInput.value='';doSearch();searchInput.focus()};
document.getElementById('noticeBtn').onclick=()=>showToast('暂无新通知');
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{if(tab.classList.contains('active'))return;showToast(`${tab.textContent}数据暂未接入`)});
const modal=document.getElementById('modal');document.getElementById('seeMore').onclick=()=>modal.classList.add('show');document.getElementById('modalClose').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
function tick(){const d=new Date(),h=String(d.getHours()).padStart(2,'0'),m=String(d.getMinutes()).padStart(2,'0');document.getElementById('clock').textContent=`${h}:${m}`}tick();setInterval(tick,30000);
</script>
</body>
</html>
